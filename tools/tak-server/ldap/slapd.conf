# Test directory. The passwords are test values and the directory has no production data.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
modulepath /usr/lib/ldap
moduleload back_mdb
pidfile /var/lib/swak-ldap/slapd.pid
# tools/tak_server.py mounts the test certificate in /certs.
TLSCACertificateFile /certs/ca.pem
TLSCertificateFile /certs/ldap.pem
TLSCertificateKeyFile /certs/ldap.key
database mdb
maxsize 16777216
suffix "dc=swak,dc=test"
rootdn "cn=admin,dc=swak,dc=test"
rootpw swak-ldap-admin
directory /var/lib/swak-ldap
access to attrs=userPassword by self write by anonymous auth by * none
access to * by * read
